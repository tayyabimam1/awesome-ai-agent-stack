name: Suggest a tool
description: Propose a repository for the list.
title: "Add "
labels: ["new tool"]
body:
  - type: input
    id: repo
    attributes:
      label: GitHub repository
      description: Full URL, e.g. https://github.com/owner/repo
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: Which section of the README it belongs in.
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: What it does, under ~100 characters, ending in a period.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Why it belongs
      description: Optional. How you have used it, or what makes it stand out.
