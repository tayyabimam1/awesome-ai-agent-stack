name: Rebuild docs site

# Keeps the GitHub Pages site in sync: whenever the README or the site code
# changes, turn README.md into data, build the React app into docs/, push it.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/build_site.py
      - site-data/stars.json
      - web/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: README to data
        run: python scripts/build_site.py
      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "docs: rebuild site from README"
          git push
