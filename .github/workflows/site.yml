name: Rebuild docs site

# Keeps the GitHub Pages site in sync: whenever README.md changes,
# regenerate docs/ from it and push the result.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/build_site.py
      - scripts/site_assets.py
      - site-data/stars.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site from README
        run: python scripts/build_site.py
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "docs: rebuild site from README"
          git push
