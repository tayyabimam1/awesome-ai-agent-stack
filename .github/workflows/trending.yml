name: Trending candidates

# Every 5 hours, look at trendshift.io and GitHub Trending for AI repos that pass
# the list's bar, aren't in the README, and haven't already been surfaced in an
# open review issue — then open an issue with the new ones to review.
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/find_trending.py > candidates.md
      - name: Open review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '^- \[ \]' candidates.md; then
            gh issue create --title "Trending candidates $(date -u +%F-%H)" \
              --label trending --body-file candidates.md
          else
            echo "No new candidates since the last review - skipping issue."
          fi
