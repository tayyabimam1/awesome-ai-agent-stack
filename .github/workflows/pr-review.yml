name: AI PR review

# The moment a PR is opened or reopened (forks included), review the diff with
# the team's FreeLLMAPI gateway and post the verdict as a PR comment.
# Comments only — it never approves, requests changes formally, or merges.
#
# Config lives in repo Settings → Secrets and variables → Actions (nothing
# sensitive is committed to this repo):
#   - Secret   FREELLMAPI_KEY: the unified FreeLLMAPI gateway key.
#   - Variable FREELLMAPI_URL: the gateway base URL (https://.../v1).
#   - Nothing else needed: the model is auto-picked from the gateway
#     (override with the REVIEW_MODEL variable if you want a specific one).
#
# Quota guardrails:
# - fires on opened/reopened only, never on every push; skips drafts and bots;
# - monthly review budget tracked in .github/pr-review-budget.json
#   (default 30, set REVIEW_MONTHLY_LIMIT repo variable to change).
# - Settings kill-switch: set the PR_REVIEW_ENABLED repo variable to "false"
#   to turn the reviewer off.
#
# Security: pull_request_target is used so fork PRs can be commented on, but
# nothing from the PR is ever executed — the script below comes from the base
# branch and the diff is only ever sent to the LLM as data.
on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to (re-)review"
        required: true

permissions:
  pull-requests: write
  contents: write

jobs:
  review:
    if: ${{ vars.PR_REVIEW_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AI review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BACKEND: freellmapi
          FREELLMAPI_KEY: ${{ secrets.FREELLMAPI_KEY }}
          FREELLMAPI_URL: ${{ vars.FREELLMAPI_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          PR_NUMBER: ${{ github.event.inputs.pr || github.event.pull_request.number }}
        run: python scripts/pr_review.py
